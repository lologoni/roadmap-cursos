# Entorno de desarrollo de Rumbo (TRD §3.3).
# Las variables salen de .env.example y, si existe, .env las sobreescribe.
name: rumbo

x-entorno: &entorno
  env_file:
    - path: .env.example
      required: true
    - path: .env
      required: false

services:
  postgres:
    image: postgres:18.6
    <<: *entorno
    ports:
      - "${POSTGRES_PUERTO:-5432}:5432"
    volumes:
      # Desde la imagen 18 PGDATA vive en /var/lib/postgresql/18/docker (riesgo R-02)
      - pgdata:/var/lib/postgresql
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    <<: *entorno
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${BACKEND_PUERTO:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build: ./frontend
    <<: *entorno
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PUERTO:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.33.0
    ports:
      - "${MAILPIT_PUERTO_UI:-8025}:8025"
      - "${MAILPIT_PUERTO_SMTP:-1025}:1025"

volumes:
  pgdata:
