[project]
name = "rumbo-backend"
version = "0.1.0"
description = "API de Rumbo: catálogo comunitario de cursos y roadmap personal"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.158.2",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "pwdlib[argon2]>=0.2,<0.3",
    "pyjwt>=2.9,<3",
    "slowapi>=0.1.9,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<0.29",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migraciones/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
